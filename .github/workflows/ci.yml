name: CI Pipeline

on:
  push:
    branches: [main, dev]

permissions:
  contents: read
  packages: write

jobs: 
 docker-images:
    name: Build and push Docker images
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set image tag
        run: |
          SHORT_SHA=${GITHUB_SHA::7}

          if [ "${GITHUB_REF_NAME}" = "dev" ]; then
            echo "IMAGE_TAG=dev-$SHORT_SHA" >> $GITHUB_ENV
          elif [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "IMAGE_TAG=prod-$SHORT_SHA" >> $GITHUB_ENV
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push changed images
        run: |
          CHANGED=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")
          

          if echo "$CHANGED" | grep -Eq '^(frontend/|package.json|pnpm-lock.yaml)'; then
            docker build \
              --target frontend-runtime \
              -f Dockerfile \
              -t ghcr.io/kebertr/leetify-frontend:${IMAGE_TAG} \
              .
            docker push ghcr.io/kebertr/leetify-frontend:${IMAGE_TAG}
          fi

          if echo "$CHANGED" | grep -Eq '^(services/penalty-api/|package.json|pnpm-lock.yaml)'; then
            docker build \
              --target penalty-runtime \
              -f Dockerfile \
              -t ghcr.io/kebertr/leetify-backend-api:${IMAGE_TAG} \
              .
            docker push ghcr.io/kebertr/leetify-backend-penalty-api:${IMAGE_TAG}
          fi