name: CI Pipeline

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker-images:
    name: Build and push Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image tag
        run: |
          SHORT_SHA=${GITHUB_SHA::7}
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            echo "IMAGE_TAG=prod-$SHORT_SHA" >> "$GITHUB_ENV"
          else
            echo "IMAGE_TAG=dev-$SHORT_SHA" >> "$GITHUB_ENV"
          fi

      - name: Build frontend
        run: docker build -t "ghcr.io/kebertr/leetify-frontend:${IMAGE_TAG}" ./frontend

      - name: Build backend
        run: docker build -t "ghcr.io/kebertr/leetify-backend-api:${IMAGE_TAG}" ./backend

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push both images
        run: |
          docker push "ghcr.io/kebertr/leetify-frontend:${IMAGE_TAG}"
          docker push "ghcr.io/kebertr/leetify-backend-api:${IMAGE_TAG}"
